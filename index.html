<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title, description, Open Graph, JSON-LD y analítica: se generan desde src/data/portfolio.js (vite.config.js) -->
    <!--seo-head-->
    <meta name="theme-color" content="#f2efe8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap" />
    <link rel="preload" as="image" type="image/webp" imagesrcset="/perfil-640.webp 640w, /perfil-1080.webp 1080w" imagesizes="(max-width: 760px) 80vw, 420px" fetchpriority="high" />

    <!-- Tema antes del primer render para evitar parpadeo -->
    <script>
      (function () {
        var d = document.documentElement, t;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.dataset.theme = t;
        d.classList.add('js');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
